<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — MAVIX Estate Command</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="login-page" style="display:flex">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">🏠</div>
      <h1>Set a New Password</h1>
    </div>
    <div id="reset-form-wrap">
      <form id="reset-form" onsubmit="submitReset(event)">
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input class="form-input" type="password" id="rp-pass" minlength="8" required placeholder="At least 8 characters">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <input class="form-input" type="password" id="rp-pass2" minlength="8" required>
        </div>
        <div id="reset-error" class="hidden" style="color:var(--crit);font-size:13px;margin-bottom:10px"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px">Update Password</button>
      </form>
    </div>
    <div id="reset-success" class="hidden">
      <p style="color:var(--success)">✅ Password updated. You can now <a href="index.html">sign in</a> with your new password.</p>
    </div>
    <div id="reset-invalid" class="hidden">
      <p style="color:var(--crit)">This reset link is invalid or missing. Please request a new one from the login page.</p>
    </div>
  </div>
</div>

<script>
  if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
    window.MAVIX_API_BASE = 'https://REPLACE-WITH-YOUR-BACKEND-URL.onrender.com/api';
  }
</script>
<script src="js/api.js"></script>
<script>
function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}
const token = getParam('token');
const tenant = getParam('tenant');
if(!token || !tenant){
  document.getElementById('reset-form-wrap').classList.add('hidden');
  document.getElementById('reset-invalid').classList.remove('hidden');
}
async function submitReset(e){
  e.preventDefault();
  const pass = document.getElementById('rp-pass').value;
  const pass2 = document.getElementById('rp-pass2').value;
  const errEl = document.getElementById('reset-error');
  errEl.classList.add('hidden');
  if(pass !== pass2){
    errEl.textContent = 'Passwords do not match.';
    errEl.classList.remove('hidden');
    return;
  }
  try{
    await MavixAPI.post('/auth/reset-password', { token, tenantSlug: tenant, newPassword: pass });
    document.getElementById('reset-form-wrap').classList.add('hidden');
    document.getElementById('reset-success').classList.remove('hidden');
  }catch(err){
    errEl.textContent = err.message || 'Something went wrong. Please request a new reset link.';
    errEl.classList.remove('hidden');
  }
}
</script>
</body>
</html>
