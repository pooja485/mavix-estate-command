name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mavix
          POSTGRES_PASSWORD: mavix_password
          POSTGRES_DB: mavix_estate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mavix -d mavix_estate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://mavix:mavix_password@localhost:5432/mavix_estate_test?schema=public
      JWT_ACCESS_SECRET: ci_test_access_secret_min_16_chars
      JWT_REFRESH_SECRET: ci_test_refresh_secret_min_16_chars
      CORS_ORIGINS: http://localhost:8080

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  frontend-lint:
    name: Frontend — syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check JS files
        run: |
          for f in frontend/public/js/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

  docker-build:
    name: Build Docker images
    needs: [backend, frontend-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t mavix-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t mavix-frontend:ci ./frontend
